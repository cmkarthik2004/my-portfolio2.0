<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 600' width='600' height='600'>
  <defs>
    <linearGradient id='bg' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#0f172a'/>
      <stop offset='50%' stop-color='#1e1b4b'/>
      <stop offset='100%' stop-color='#020617'/>
    </linearGradient>
    <linearGradient id='accent' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#d97706'/>
      <stop offset='100%' stop-color='#f59e0b'/>
    </linearGradient>
    <linearGradient id='skin' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#e0a96d'/>
      <stop offset='100%' stop-color='#c68b59'/>
    </linearGradient>
    <filter id='glow' x='-20%' y='-20%' width='140%' height='140%'>
      <feGaussianBlur stdDeviation='20' result='blur'/>
      <feComposite in='SourceGraphic' in2='blur' operator='over'/>
    </filter>
  </defs>
  <rect width='600' height='600' rx='40' fill='url(#bg)'/>
  <circle cx='300' cy='240' r='170' fill='url(#accent)' opacity='0.18' filter='url(#glow)'/>
  
  <!-- Stylized Developer Silhouette Portrait -->
  <g transform='translate(0, 15)'>
    <!-- Head/Face -->
    <ellipse cx='300' cy='230' rx='80' ry='92' fill='url(#skin)'/>
    <!-- Neck -->
    <path d='M275,305 L275,360 L325,360 L325,305 Z' fill='#ba7a48'/>
    <!-- Hair -->
    <path d='M215,220 Q230,120 300,125 Q370,120 385,220 Q375,170 300,168 Q225,170 215,220 Z' fill='#1c1917'/>
    <!-- Side Hair -->
    <path d='M215,220 Q210,250 222,265 L225,235 Z' fill='#1c1917'/>
    <path d='M385,220 Q390,250 378,265 L375,235 Z' fill='#1c1917'/>
    <!-- Eyebrows -->
    <path d='M240,195 Q260,190 275,196' fill='none' stroke='#1c1917' stroke-width='4' stroke-linecap='round'/>
    <path d='M325,196 Q340,190 360,195' fill='none' stroke='#1c1917' stroke-width='4' stroke-linecap='round'/>
    <!-- Glasses -->
    <rect x='230' y='200' width='55' height='36' rx='8' fill='none' stroke='#0f172a' stroke-width='5'/>
    <rect x='315' y='200' width='55' height='36' rx='8' fill='none' stroke='#0f172a' stroke-width='5'/>
    <line x1='285' y1='215' x2='315' y2='215' stroke='#0f172a' stroke-width='5'/>
    <!-- Eyes behind glasses -->
    <circle cx='258' cy='218' r='5' fill='#1e293b'/>
    <circle cx='342' cy='218' r='5' fill='#1e293b'/>
    <!-- Smile -->
    <path d='M272,275 Q300,295 328,275' fill='none' stroke='#854d0e' stroke-width='4' stroke-linecap='round'/>
    <!-- Shoulders / Torso / Blazer -->
    <path d='M140,510 C140,370 210,345 300,345 C390,345 460,370 460,510 Z' fill='#1e293b'/>
    <!-- Shirt / Collar -->
    <path d='M270,345 L300,420 L330,345 Z' fill='#f8fafc'/>
    <path d='M260,345 L300,400 L285,460 L240,355 Z' fill='#0f172a'/>
    <path d='M340,345 L300,400 L315,460 L360,355 Z' fill='#0f172a'/>
  </g>
  <!-- Modern Code Badge Overlay -->
  <rect x='130' y='510' width='340' height='46' rx='23' fill='#0f172a' stroke='#d97706' stroke-width='1.5'/>
  <text x='300' y='539' font-family='system-ui, -apple-system, sans-serif' font-weight='700' font-size='15' fill='#f8fafc' text-anchor='middle' letter-spacing='0.5'>C M Karthik • Full-Stack Developer</text>
</svg>
